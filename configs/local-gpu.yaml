# Real-run config for the local RTX 4500 Ada (24 GB), no server process.
#
# vLLM has no supported Windows build, so generation happens in-process through
# `transformers` on CUDA with dynamic micro-batching. Nothing above the backend
# knows the difference; `configs/vllm-8b.yaml` is the same experiment against a
# WSL2 or remote vLLM server.
#
#   collabengine calibrate --config configs/local-gpu.yaml   # Phase 1
#   collabengine baseline  --config configs/local-gpu.yaml   # Phase 2
#   collabengine ablate    --config configs/local-gpu.yaml   # Phase 3
#   collabengine analyze   --config configs/local-gpu.yaml
#
# One model serves every agent. That is the control that rules out model
# heterogeneity as the source of any differentiation observed.
name: qwen3-8b-local
seed_start: 0
n_episodes: 100
out_dir: runs

# The runner fans this many episodes at the backend at once; the backend batches
# whatever turns are waiting. Higher than max_batch_size on purpose -- the queue
# should never be empty when a forward pass finishes.
# Deliberately well below the stage size. Fanning all 48 stage-1 episodes at the
# card at once makes them advance in lockstep and finish in one clump at the
# very end, so the transcript stays empty for hours, resume has nothing to
# resume from, and a crash costs the whole stage. Running them in waves gives up
# a little batch fullness for episodes that land steadily.
max_concurrency: 24

backend:
  kind: hf
  model: Qwen/Qwen3-8B
  device: cuda
  dtype: bfloat16
  # Two ceilings, and the token one is the real constraint: KV cache scales with
  # tokens, not requests. A high sequence cap lets short round-one turns pack in;
  # the token budget holds peak memory roughly constant as contexts grow, which
  # is what stops a batch of full-transcript turns from OOMing.
  #
  # Both numbers come from sweeping batch size at a realistic 1600-token context
  # (scratchpad bench.py), not from head-count arithmetic:
  #
  #     batch  8   72.6 tok/s   16.8 GiB
  #     batch 16   94.1 tok/s   18.3 GiB
  #     batch 24  102.8 tok/s   19.8 GiB
  #     batch 32  108.1 tok/s   21.4 GiB   <- best
  #     batch 48   71.1 tok/s   24.4 GiB   <- collapses
  #
  # The batch-48 row is the important one: throughput falls by a third at the
  # point peak memory approaches the 24 GiB card. Windows does not OOM there, it
  # pages to host memory over PCIe and keeps reporting 100% utilization, so the
  # failure is invisible from nvidia-smi and looks exactly like a healthy run.
  # Staying near 21 GiB is therefore a throughput decision, not a safety margin.
  #
  # Marginal cost measured across those rows is ~123 KiB/token, close to the
  # 144 KiB/token GQA arithmetic predicts (36 layers x 8 kv-heads x 128 dim x 2 x
  # bf16). An earlier sweep inferred ~490 KiB/token and set the budget to 11000;
  # that figure was taken inside the paging regime, and the resulting batch of
  # ~7 ran the card at roughly 40% of its throughput.
  # Confirmed at the production shape rather than the sweep's: 13 sequences of
  # 1300 prompt tokens generating 1024 new peaks at 19.3 GiB, i.e. ~123 KiB per
  # budgeted token as above. 40000 tokens puts the peak near 20.2 GiB, which
  # leaves headroom for the longest round-three chunks without giving up batch.
  max_batch_size: 32
  max_batch_tokens: 40000
  batch_window_s: 0.05     # invisible next to a multi-second generation
  max_model_len: 8192
  enable_thinking: false   # a <think> block would consume the whole turn budget

team:
  n_agents: 4
  rounds: 3
  difficulty: medium       # set from `collabengine calibrate`, not by guess
  symmetry: name_seed
  randomize_turn_order: true   # the C2 control; do not disable without a reason
  # 512 was not enough to answer this task. In the first real corpus 72% of
  # agent turns hit the cap and were cut off mid-sentence, and every episode in
  # which *all* turns were cut off graded 0.0 -- the model spends its budget
  # walking 16 jobs through 29 constraints and never reaches the answer block.
  # That is not a slow-agent problem, it is a measurement problem: truncation
  # scales with how much an agent writes, which is the emergent behaviour under
  # study, so the cap was quietly scoring the verbose agents lowest.
  max_tokens: 1024
  temperature: 0.8
  top_p: 0.95
