# Real-run config for the local RTX 4500 Ada (24 GB), no server process.
#
# vLLM has no supported Windows build, so generation happens in-process through
# `transformers` on CUDA with dynamic micro-batching. Nothing above the backend
# knows the difference; `configs/vllm-8b.yaml` is the same experiment against a
# WSL2 or remote vLLM server.
#
#   collabengine calibrate --config configs/local-gpu.yaml   # Phase 1
#   collabengine baseline  --config configs/local-gpu.yaml   # Phase 2
#   collabengine ablate    --config configs/local-gpu.yaml   # Phase 3
#   collabengine analyze   --config configs/local-gpu.yaml
#
# One model serves every agent. That is the control that rules out model
# heterogeneity as the source of any differentiation observed.
name: qwen3-8b-local
seed_start: 0
n_episodes: 100
out_dir: runs

# Deliberately well below the stage size. Fanning all 48 stage-1 episodes at the
# card at once makes them advance in lockstep and finish in one clump at the
# very end, so the transcript stays empty for hours, resume has nothing to
# resume from, and a crash costs the whole stage. Running them in waves gives up
# a little batch fullness for episodes that land steadily.
max_concurrency: 24

backend:
  kind: hf
  model: Qwen/Qwen3-8B
  device: cuda
  dtype: bfloat16
  # Two ceilings, and the token one is the real constraint: KV cache scales with
  # tokens, not requests, so the token budget is what holds peak memory roughly
  # constant as contexts grow. It is also, directly, the throughput knob: every
  # turn carries the ~2500-token task brief and reaches ~4000 by round three, so
  # budget / (context + max_tokens) is how many turns share a forward pass --
  # about 4 at 24000, 5-6 at 30000.
  #
  # Sweeping batch size at a 1600-token context (scratchpad bench.py):
  #
  #     batch  8   72.6 tok/s   16.8 GiB
  #     batch 16   94.1 tok/s   18.3 GiB
  #     batch 24  102.8 tok/s   19.8 GiB
  #     batch 32  108.1 tok/s   21.4 GiB   <- best
  #     batch 48   71.1 tok/s   24.4 GiB   <- collapses
  #
  # Marginal cost across the healthy rows is ~123 KiB/token, near the 144 KiB the
  # GQA geometry predicts (36 layers x 8 kv-heads x 128 dim x 2 x bf16).
  #
  # The batch-48 row is the one to read twice. Throughput falls by a third as
  # peak memory approaches the card, because Windows does not raise OOM there --
  # the WDDM driver pages the working set to host memory over PCIe and keeps
  # reporting 100% utilization. Measured in that state: 24 GiB resident, 64 W of
  # a 210 W cap, and 19 GB/s out to host with 12 GB/s back. Every surface that
  # would normally signal trouble looks healthy, which is what makes it the most
  # expensive failure mode on this machine. `nvidia-smi dmon -s t` is the one
  # that does not lie: sustained multi-GB/s under pure decode means the budget is
  # too high, whatever the peak allocation says.
  #
  # memory_fraction is the actual defence -- it caps the process so an oversized
  # batch OOMs recoverably instead of paging silently. 30000 tokens did OOM under
  # an 0.85 cap, but only because a failed batch could not then free its own KV
  # cache (the retry ran inside the except block, where the live traceback pins
  # it), so the budget had been cut to compensate for a bug. With that fixed,
  # 0.90 allows 21.6 GiB against 15.3 of weights and ~3.5 of KV.
  max_batch_size: 32
  max_batch_tokens: 30000
  # 0.90 (21.6 GiB) was not enough headroom to *prefill* a round-three context.
  # A single 7000-9000 token sequence needs under 1 GiB of KV, so what fails is
  # the transient activation peak against ~5 GiB free above the weights. It
  # failed only in the team arm, because solo episodes are 3 turns and never
  # get that long -- the same one-sided bias as the truncation it replaced.
  #
  # Measured: 35 such OOMs across 24 four-agent episodes, leaving 1 of 12
  # baseline episodes clean. 0.95 gives ~22.8 GiB, and paging was first observed
  # at 23.9, so the margin is real but thin -- watch `nvidia-smi dmon -s t`.
  memory_fraction: 0.95
  batch_window_s: 0.05     # invisible next to a multi-second generation
  # 8192 truncated the team arm and only the team arm. A solo episode is 3
  # turns and peaks near 5700 tokens; a four-agent episode is 12 turns and
  # crosses 8192 on its last two -- the turns that submit the answer -- losing
  # the head of the brief, which is where the worker capacities are defined.
  # That biases the team score down and the Phase 1 gate toward failure, which
  # is the conclusion it would have been read as supporting.
  #
  # This is our ceiling, not the model's: Qwen3-8B handles far more. Raising it
  # costs no memory, because max_batch_tokens still bounds the KV cache; it only
  # lowers the batch once contexts are long, which is already the case.
  max_model_len: 12288
  enable_thinking: false   # a <think> block would consume the whole turn budget

team:
  n_agents: 4
  rounds: 3
  # Measured, and the reason it is not `medium`. At medium, with the token cap
  # finally large enough not to truncate the answer, one agent scores 0.879 and
  # four agents score 0.905 over 12 episodes each -- a gap of +0.026 against a
  # standard error of ~0.029, i.e. nothing. PLAN.md 4 makes that a stop
  # condition: an operating point where the task does not reward collaboration
  # cannot support an ablation study, because every drop would be measured
  # against a team that was not contributing in the first place.
  #
  # Worth noting how this was missed. `calibrate` chose medium while
  # max_tokens was 512, which truncated 72% of turns and pushed solo down to
  # 0.55 -- medium looked correctly pitched precisely because the instrument
  # was broken. Raising the cap fixed the scores and invalidated the difficulty
  # choice in the same stroke.
  difficulty: hard
  symmetry: name_seed
  randomize_turn_order: true   # the C2 control; do not disable without a reason
  # 512 was not enough to answer this task. In the first real corpus 72% of
  # agent turns hit the cap and were cut off mid-sentence, and every episode in
  # which *all* turns were cut off graded 0.0 -- the model spends its budget
  # walking 16 jobs through 29 constraints and never reaches the answer block.
  # That is not a slow-agent problem, it is a measurement problem: truncation
  # scales with how much an agent writes, which is the emergent behaviour under
  # study, so the cap was quietly scoring the verbose agents lowest.
  max_tokens: 1024
  temperature: 0.8
  top_p: 0.95
