# The medium operating point, re-measured on the fixed harness.
#
# This config exists to date a retraction. The original medium comparison
# (team 0.905 vs solo 0.879) was computed on a team arm in which 96 of 144
# agent turns had failed to generate -- see RESEARCH-LOG 4.1. It was withdrawn,
# which left the difficulty curve with one measured point (`hard`, fails) and
# one hole.
#
# Only the team arm needs regenerating. The medium solo arm (0.879, n=12, zero
# instrument failures) is sound and stays: a solo episode is 3 turns and peaks
# near 5700 tokens, so neither the 8192 truncation nor the 0.90 memory cap that
# damaged the team arm could reach it. Reusing it is what makes this 12
# episodes instead of 24.
#
#   collabengine baseline --config configs/hf-local/medium.yaml
#
# Everything below matches configs/hf-local/hard.yaml except `name` (so the corpus
# lands in its own run_dir and cannot contaminate the hard corpus) and
# `difficulty`. Any other divergence would make the two points on the curve
# incomparable, which is the entire purpose of the exercise.
name: qwen3-8b-medium
seed_start: 0
n_episodes: 12
out_dir: runs

max_concurrency: 24

backend:
  kind: hf
  model: Qwen/Qwen3-8B
  device: cuda
  dtype: bfloat16
  max_batch_size: 32
  max_batch_tokens: 30000
  memory_fraction: 0.95
  batch_window_s: 0.05
  max_model_len: 12288
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: medium
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  temperature: 0.8
  top_p: 0.95
