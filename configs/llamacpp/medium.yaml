# The `medium` operating point on the served 4-bit instrument.
#
# The low end of the difficulty curve. Both arms are regenerated here: unlike
# the bf16 re-measurement in configs/hf-local/medium.yaml, where the solo arm
# was sound and could be reused, nothing measured on Qwen3-8B carries across a
# change of model family and precision. See PREREG-xhard Amendment 2.
#
# This tier is also the manipulation check's anchor. If solo does not degrade
# from `medium` to `hard` to `xhard` on this instrument, the instance size is
# not biting and H1 is untestable on this run rather than false (H4).
#
#   python scripts/preflight.py --config configs/llamacpp/medium.yaml
#   collabengine pipeline --config configs/llamacpp/medium.yaml \
#                         --phases baseline,solo
#
# Identical to configs/llamacpp/xhard.yaml but for `name` and `difficulty`.
name: llama31-8b-q4-medium
seed_start: 0
n_episodes: 24
out_dir: runs

max_concurrency: 4

backend:
  kind: openai
  model: Meta-Llama-3.1-8B-Instruct-Q4_K_M
  base_url: http://127.0.0.1:8000/v1
  max_concurrency: 4
  timeout_s: 900
  max_retries: 4
  verify_model: true
  # Over-provisioned for this tier -- a `medium` context peaks near 13,000
  # tokens, not 17,408. Held at the `xhard` value anyway: a slot size that
  # varies by tier is an instrument that varies by tier, and the whole point of
  # the curve is that only the instance changes along it.
  max_model_len: 17408
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: medium
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  temperature: 0.8
  top_p: 0.95
