# H3b -- is the ablation instrument neutral?
#
# PREREG-phase3 Amendment 1. Everything about this instrument is identical to
# configs/llamacpp/medium-ans.yaml except the seeds and n. It has to be: the
# question is whether two ways of running the SAME three agents give the same
# answer, so any other difference would be the thing being measured.
#
#   live:A4          n_agents 4, exclude A4  -> roster A1 A2 A3, briefed as 4
#   capacity:3       n_agents 3              -> roster A1 A2 A3, briefed as 3
#
# Those are the only two arms whose rosters match, because capacity_control
# lowers n_agents by one and build_team numbers positionally, so the smaller
# team is always A1..A(n-1). At n=48 they differed by +0.052 -- 74% of the drop
# attributed to removing A4 -- at p = 0.123 (RESEARCH-LOG 4.20). That is both
# too large to ignore and too under-powered to act on, which is what this run
# fixes.
#
# Why this is worth 3 GPU h before the 17 h confirmatory grid: if the two arms
# differ, then live-ablation drops measure the configuration as much as the
# agent, every number in 4.19 and 4.20 needs restating against the capacity arm
# rather than the baseline, and the grid would be measuring the wrong thing.
# Logically prior, and an eighth the cost.
#
# Fresh seeds 1000-1149, disjoint from the pilot's 0-47, so nothing here can be
# pooled with the corpus that generated the hypothesis. New run directory for
# the same reason.
#
#   python scripts/ops/preflight.py --config configs/llamacpp/medium-h3b.yaml
#   bash scripts/experiments/h3b-run.sh
name: llama31-8b-q4-medium-h3b
seed_start: 1000
n_episodes: 150
out_dir: runs

max_concurrency: 7

backend:
  kind: openai
  model: Meta-Llama-3.1-8B-Instruct-Q4_K_M
  base_url: http://127.0.0.1:8000/v1
  max_concurrency: 7
  timeout_s: 900
  max_retries: 4
  verify_model: true
  max_model_len: 15360
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: medium
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  answer_max_tokens: 3072
  temperature: 0.8
  top_p: 0.95
