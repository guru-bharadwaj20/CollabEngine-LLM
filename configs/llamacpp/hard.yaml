# The `hard` operating point on the served 4-bit instrument.
#
# This is not a re-run for its own sake. H1 in docs/PREREG-xhard.md is a *trend*
# across {medium, hard, xhard}, and a trend whose third point was measured on a
# different model at a different precision measures the instrument change, not
# the instance size. H4 is worse: it compares solo at `xhard` against the number
# 0.842, which is a Qwen3-8B bf16 measurement and cannot be a control total for
# a Llama-3.1-8B Q4 arm. Both hypotheses need this tier on the new instrument.
#
# See PREREG-xhard Amendment 2, written before any episode here was generated.
#
#   python scripts/ops/preflight.py --config configs/llamacpp/hard.yaml
#   collabengine pipeline --config configs/llamacpp/hard.yaml \
#                         --phases baseline,solo
#
# Everything below matches configs/llamacpp/xhard.yaml except `name` (so the
# corpus lands in its own run_dir and cannot contaminate another tier) and
# `difficulty`. Any other divergence makes the points on the curve
# incomparable, which is the entire purpose of running this at all.
name: llama31-8b-q4-hard
seed_start: 0
n_episodes: 24
out_dir: runs

max_concurrency: 4

backend:
  kind: openai
  model: models/Meta-Llama-3.1-8B-Instruct.Q4_K_M.gguf
  base_url: http://127.0.0.1:8000/v1
  max_concurrency: 4
  timeout_s: 900
  max_retries: 4
  verify_model: true
  max_model_len: 17408
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: hard
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  temperature: 0.8
  top_p: 0.95
