# Precision ladder, middle rung: the same Llama-3.1-8B at Q8_0.
#
# Final Sweep 1.4. PAPER-DRAFT section 9 argues that 4-bit weights might degrade
# long-context instruction-following more in the team arm than the solo arm, and
# that this would bias *against* a team advantage. That is an argument, not a
# measurement. Three rungs -- Q4_K_M, Q8_0, f16 -- turn it into one.
#
# **All three rungs come from one uploader** (mradermacher), so the only thing
# varying across them is the quantisation. A ladder assembled from three
# uploaders would confound precision with whoever ran the conversion; see
# scripts/ops/fetch_models.py and docs/ENVIRONMENT.md for the checksums.
#
# The claim under test is an interaction, not a main effect: "4-bit is worse"
# proves nothing here, for the same reason a main effect of ablation proves
# nothing (PLAN section 0). What matters is whether it is worse *for the team
# arm specifically*.
#
#   scripts/ops/serve.sh --model q8 --detach
name: llama31-8b-q8-medium
seed_start: 1000
n_episodes: 150
out_dir: runs

max_concurrency: 7

backend:
  kind: openai
  model: models/Meta-Llama-3.1-8B-Instruct.Q8_0.gguf
  base_url: http://127.0.0.1:8000/v1
  max_concurrency: 7
  timeout_s: 900
  max_retries: 4
  verify_model: true
  max_model_len: 15360
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: medium
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  answer_max_tokens: 3072
  temperature: 0.8
  top_p: 0.95
