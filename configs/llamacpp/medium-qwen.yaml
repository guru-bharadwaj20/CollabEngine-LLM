# Second model family: Qwen2.5-7B-Instruct, same quantisation, same instrument.
#
# Final Sweep 1.2. Every reported number in this project is Llama-3.1-8B at
# Q4_K_M, so "is this an 8B-Llama quirk or a general phenomenon" has no answer.
# This arm and medium-mistral.yaml give it one.
#
# **Matched on everything except the weights.** Same served build, same 18,432
# tokens per slot, same Q4_K_M, same seeds 1000-1149, same rounds, same per-turn
# cap, same answer budget. `backend.model` is the only line that differs from
# medium-h3b.yaml.
#
# configs/hf-local/ and configs/vllm/ already name Qwen3-8B and are NOT this
# arm: they are a different backend at bf16, so reusing them would confound
# model family with instrument -- the error RESEARCH-LOG 4.11 refused to make
# when it moved the whole difficulty curve onto one instrument together.
#
#   scripts/ops/serve.sh --model qwen --detach
#   python scripts/ops/preflight.py --config configs/llamacpp/medium-qwen.yaml
name: qwen25-7b-q4-medium
seed_start: 1000
n_episodes: 150
out_dir: runs

max_concurrency: 7

backend:
  kind: openai
  model: models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
  base_url: http://127.0.0.1:8000/v1
  max_concurrency: 7
  timeout_s: 900
  max_retries: 4
  verify_model: true
  max_model_len: 15360
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: medium
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  answer_max_tokens: 3072
  temperature: 0.8
  top_p: 0.95
