# Third model family: Mistral-7B-Instruct-v0.3, same quantisation, same instrument.
#
# Final Sweep 1.2, second of two. Read together with medium-qwen.yaml: one extra
# family answers "is it Llama", two answer "is it this scale". Same seeds, same
# geometry, same caps; `backend.model` is the only line that differs.
#
#   scripts/ops/serve.sh --model mistral --detach
#   python scripts/ops/preflight.py --config configs/llamacpp/medium-mistral.yaml
name: mistral-7b-q4-medium
seed_start: 1000
n_episodes: 150
out_dir: runs

max_concurrency: 7

backend:
  kind: openai
  model: models/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
  base_url: http://127.0.0.1:8000/v1
  max_concurrency: 7
  timeout_s: 900
  max_retries: 4
  verify_model: true
  max_model_len: 15360
  enable_thinking: false

team:
  n_agents: 4
  rounds: 3
  difficulty: medium
  symmetry: name_seed
  randomize_turn_order: true
  max_tokens: 1024
  answer_max_tokens: 3072
  temperature: 0.8
  top_p: 0.95
